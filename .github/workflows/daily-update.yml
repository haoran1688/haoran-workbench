name: 每日内容更新

on:
  schedule:
    - cron: '0 23 * * *'   # 每天 23:00 UTC = 北京时间 07:00
  workflow_dispatch:      # 可手动触发

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 抓取并生成 data.json
        env:
          TIAN_API_KEY: ${{ secrets.TIAN_API_KEY }}
        run: node .github/scripts/build-data.js

      - name: 提交更新
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data.json
          if git diff --cached --quiet; then
            echo "无变化，跳过提交"
          else
            git commit -m "daily: 更新内容数据 $(date +%F)"
            git push
          fi
